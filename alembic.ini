[alembic]
# chemin vers les migrations
script_location = migrations

# ajout du dossier courant au path
prepend_sys_path = .

# URL de ta base Supabase
sqlalchemy.url = postgresql+psycopg2://postgres.ycfnkmreblxkohrfpklh:Narcisseapelete@aws-0-eu-west-2.pooler.supabase.com:6543/postgres?sslmode=require

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
